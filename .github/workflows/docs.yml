name: Publish released Elixir documentation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elixir-hex-release
  cancel-in-progress: false

jobs:
  docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: hex-publish
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.x'
          otp-version: '28.x'
          version-type: loose
      - run: mix deps.get
      - name: Publish corrected docs without changing the released package
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: bash scripts/publish-docs.sh

name: Elixir SDK certification

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  certify:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17.x"
            otp: "27.x"
          - elixir: "1.18.x"
            otp: "27.x"
          - elixir: "1.19.x"
            otp: "28.x"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: loose
      - name: Certify public SDK
        run: bash scripts/certify.sh

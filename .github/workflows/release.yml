name: Publish Elixir beta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elixir-hex-release
  cancel-in-progress: false

jobs:
  certify:
    uses: ./.github/workflows/ci.yml

  acceptance:
    needs: certify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: sdk-sandbox
    env: &sandbox-env
      AETHER_SDK_SANDBOX_TOKEN_URL: ${{ vars.AETHER_SDK_SANDBOX_TOKEN_URL }}
      AETHER_SDK_SANDBOX_IDENTITY_URL: ${{ vars.AETHER_SDK_SANDBOX_IDENTITY_URL }}
      AETHER_SDK_SANDBOX_EVENTS_URL: ${{ vars.AETHER_SDK_SANDBOX_EVENTS_URL }}
      AETHER_SDK_SANDBOX_EVENTS_AUDIENCE: ${{ vars.AETHER_SDK_SANDBOX_EVENTS_AUDIENCE }}
      AETHER_SDK_SANDBOX_NOTIFICATIONS_URL: ${{ vars.AETHER_SDK_SANDBOX_NOTIFICATIONS_URL }}
      AETHER_SDK_SANDBOX_NOTIFICATIONS_AUDIENCE: ${{ vars.AETHER_SDK_SANDBOX_NOTIFICATIONS_AUDIENCE }}
      AETHER_SDK_SANDBOX_STORAGE_URL: ${{ vars.AETHER_SDK_SANDBOX_STORAGE_URL }}
      AETHER_SDK_SANDBOX_STORAGE_AUDIENCE: ${{ vars.AETHER_SDK_SANDBOX_STORAGE_AUDIENCE }}
      AETHER_SDK_SANDBOX_WEBHOOKS_URL: ${{ vars.AETHER_SDK_SANDBOX_WEBHOOKS_URL }}
      AETHER_SDK_SANDBOX_WEBHOOKS_AUDIENCE: ${{ vars.AETHER_SDK_SANDBOX_WEBHOOKS_AUDIENCE }}
      AETHER_SDK_SANDBOX_NAMESPACE_ID: ${{ vars.AETHER_SDK_SANDBOX_NAMESPACE_ID }}
      AETHER_SDK_SANDBOX_CLIENT_ID: ${{ secrets.AETHER_SDK_SANDBOX_CLIENT_ID }}
      AETHER_SDK_SANDBOX_CLIENT_SECRET: ${{ secrets.AETHER_SDK_SANDBOX_CLIENT_SECRET }}
      AETHER_ELIXIR_EMAIL_ACCEPTANCE_JSON: ${{ vars.AETHER_ELIXIR_EMAIL_ACCEPTANCE_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.x'
          otp-version: '28.x'
          version-type: loose
      - run: mix deps.get
      - run: bash scripts/test-package.sh --hosted
      - run: mix hex.build
      - run: mix run scripts/verify-email-acceptance.exs
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-hex-package
          path: aether_sdk-*.tar
          if-no-files-found: error

  publish:
    needs: acceptance
    runs-on: ubuntu-latest
    environment: hex-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.x'
          otp-version: '28.x'
          version-type: loose
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-hex-package
          path: reviewed
      - run: mix deps.get
      - name: Verify and publish immutable package and docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: bash scripts/publish.sh
      - name: Create immutable tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(mix run --no-start -e 'IO.write(Mix.Project.config()[:version])' | tail -1)
          tag="v${version}"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/${tag}"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --prerelease --title "Elixir SDK ${version}" --notes-file CHANGELOG.md
          fi

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    environment: sdk-sandbox
    env: *sandbox-env
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.x'
          otp-version: '28.x'
          version-type: loose
      - run: mix deps.get
      - name: Install exact published Hex package and exercise hosted APIs
        run: |
          version=$(mix run --no-start -e 'IO.write(Mix.Project.config()[:version])' | tail -1)
          bash scripts/test-published.sh "$version"
